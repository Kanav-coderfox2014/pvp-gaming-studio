<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Fighters</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

    <div class="title-area">

        <h1>NEON FIGHTERS</h1>

        <p>Fight. Jump. Block. Win.</p>

    </div>


    <div class="difficulty">

        <button id="easyBtn" class="difficulty-btn active">
            EASY
        </button>

        <button id="mediumBtn" class="difficulty-btn">
            MEDIUM
        </button>

        <button id="hardBtn" class="difficulty-btn">
            HARD
        </button>

    </div>

</header>


<section class="hud">

    <div class="health-section">

        <div class="hud-label">
            PLAYER
        </div>

        <div class="health-bar">

            <div
                id="playerHealth"
                class="health-fill player-health">
            </div>

        </div>

        <div
            id="playerHealthText"
            class="health-number">
            100
        </div>

    </div>


    <div class="round-info">

        <div class="round-label">
            ROUND
        </div>

        <div>

            <span
                id="playerScore"
                class="score">
                0
            </span>

            <span class="score-dash">
                -
            </span>

            <span
                id="cpuScore"
                class="score">
                0
            </span>

        </div>

        <div
            id="timer"
            class="timer">
            60
        </div>

    </div>


    <div class="health-section cpu-hud">

        <div class="hud-label">
            CPU
        </div>

        <div class="health-bar">

            <div
                id="cpuHealth"
                class="health-fill cpu-health">
            </div>

        </div>

        <div
            id="cpuHealthText"
            class="health-number">
            100
        </div>

    </div>

</section>


<main id="arena">

    <div class="arena-grid"></div>


    <!-- LOW PLATFORMS -->

    <div
        class="platform platform-left-low">
    </div>

    <div
        class="platform platform-right-low">
    </div>


    <!-- CENTRE PLATFORM -->

    <div
        class="platform platform-center">
    </div>


    <!-- HIGH PLATFORMS -->

    <div
        class="platform platform-left-high">
    </div>

    <div
        class="platform platform-right-high">
    </div>


    <!-- FLOOR -->

    <div class="floor"></div>


    <!-- PLAYER -->

    <div
        id="player"
        class="fighter player">

        <div class="fighter-head"></div>

        <div class="fighter-body"></div>

        <div class="fighter-arm fighter-arm-left"></div>

        <div class="fighter-arm fighter-arm-right"></div>

        <div class="fighter-leg fighter-leg-left"></div>

        <div class="fighter-leg fighter-leg-right"></div>

    </div>


    <!-- CPU -->

    <div
        id="cpu"
        class="fighter cpu">

        <div class="fighter-head"></div>

        <div class="fighter-body"></div>

        <div class="fighter-arm fighter-arm-left"></div>

        <div class="fighter-arm fighter-arm-right"></div>

        <div class="fighter-leg fighter-leg-left"></div>

        <div class="fighter-leg fighter-leg-right"></div>

    </div>


    <!-- HIT MESSAGE -->

    <div
        id="hitEffect"
        class="hit-effect">
        HIT!
    </div>


    <!-- BLOCK TIMER -->

    <div
        id="blockIndicator"
        class="block-indicator">
        3
    </div>


    <!-- RESULT -->

    <div
        id="resultOverlay"
        class="result-overlay">

        <div class="result-box">

            <div
                id="confetti"
                class="confetti">
            </div>

            <h2 id="resultTitle">
                YOU WIN!
            </h2>

            <div
                id="resultScore"
                class="result-score">
                3 - 0
            </div>

            <p id="resultMessage">
                Amazing fighting!
            </p>

            <button
                id="playAgainBtn"
                class="main-button">
                PLAY AGAIN
            </button>

        </div>

    </div>

</main>


<section class="controls">

    <div class="control-group">

        <h3>
            CONTROLS
        </h3>


        <div class="control-row">

            <span class="key">
                ←
            </span>

            <span class="key">
                →
            </span>

            <span>
                Move
            </span>

        </div>


        <div class="control-row">

            <span class="key">
                ↑
            </span>

            <span>
                Jump
            </span>

        </div>


        <div class="control-row">

            <span class="key">
                SPACE
            </span>

            <span>
                Punch
            </span>

        </div>


        <div class="control-row">

            <span class="key">
                F
            </span>

            <span>
                Kick
            </span>

        </div>


        <div class="control-row">

            <span class="key">
                D
            </span>

            <span>
                Block
            </span>

        </div>

    </div>


    <div class="game-buttons">

        <button
            id="startBtn"
            class="main-button">
            START GAME
        </button>

        <button
            id="restartBtn"
            class="main-button">
            RESTART
        </button>

        <button
            id="fullscreenBtn"
            class="main-button">
            FULLSCREEN
        </button>

    </div>

</section>


<script src="js/game.js"></script>

</body>
</html>
